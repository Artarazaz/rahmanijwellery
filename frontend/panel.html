<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#312f30">
    <title>رحمانی | پنل مدیریت</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/zarnegar-design-system.css?v=20260905-z2">
    <link rel="stylesheet" href="/css/style.css?v=20260905-z2">
    <link rel="stylesheet" href="/css/catalog.css?v=20260905-z2">
</head>

<body data-page="panel">
    <main class="panel-page">
        <section class="panel-login" id="panel-login">
            <div class="panel-card">
                <p class="eyebrow">STUDIO / RAHMANI</p>
                <h1>ورود ادمین</h1>
                <p>از اینجا می‌توانید عکس، وزن، دسته و اجرت هر محصول را بدون نیاز به برنامه‌نویس وارد کنید.</p>
                <form class="panel-form" id="login-form">
                    <label>نام کاربری
                        <input type="text" name="username" autocomplete="username" required>
                    </label>
                    <label>رمز عبور
                        <input type="password" name="password" autocomplete="current-password" required>
                    </label>
                    <button class="button button-gold" type="submit">ورود به پنل</button>
                </form>
                <p class="panel-status" id="panel-status" role="status"></p>
            </div>
        </section>

        <section class="panel-desk" id="panel-desk" hidden>
            <div class="panel-toolbar">
                <div>
                    <p class="eyebrow">ویترین زنده</p>
                    <h1>مدیریت محصولات</h1>
                    <p class="panel-help">خوش آمدید، <span id="panel-user"></span></p>
                </div>
                <div class="panel-actions">
                    <a class="panel-ghost" href="/products/">مشاهده ویترین</a>
                    <button class="panel-ghost" id="logout-button" type="button">خروج</button>
                </div>
            </div>
            <p class="panel-status" id="panel-status-desk" role="status"></p>
            <div class="panel-layout">
                <form class="panel-card panel-form" id="product-form">
                    <h2 id="form-title">افزودن محصول جدید</h2>
                    <label>نام محصول
                        <input type="text" name="name" required>
                    </label>
                    <label>کد محصول
                        <input type="text" name="sku" placeholder="مثلاً R-040">
                    </label>
                    <label>دسته‌بندی
                        <select name="category" required>
                            <option value="ring">انگشتر</option>
                            <option value="necklace">گردنبند</option>
                            <option value="bracelet">دستبند</option>
                            <option value="earring">گوشواره</option>
                            <option value="other">سایر</option>
                        </select>
                    </label>
                    <label>وزن (گرم)
                        <input type="number" name="weight" min="0.01" step="0.01" required>
                    </label>
                    <label>اجرت (تومان)
                        <input type="number" name="making_charge" min="0" step="1" required>
                    </label>
                    <label>سود (درصد)
                        <input type="number" name="profit" min="0" step="0.1" value="7">
                    </label>
                    <label>توضیح کوتاه
                        <textarea name="note" maxlength="180"></textarea>
                    </label>
                    <label>عکس‌های محصول
                        <input id="product-images" type="file" accept="image/*" multiple>
                    </label>
                    <div class="image-preview" id="image-preview"></div>
                    <div class="panel-checks">
                        <label><input id="product-published" type="checkbox" checked> نمایش در سایت</label>
                        <label><input id="product-featured" type="checkbox"> منتخب صفحه اصلی</label>
                    </div>
                    <div class="panel-actions">
                        <button class="button button-gold" type="submit" id="submit-label">افزودن به ویترین</button>
                        <button class="panel-ghost" id="reset-form" type="button">محصول جدید</button>
                    </div>
                </form>
                <div class="panel-card">
                    <h2>لیست محصولات</h2>
                    <div id="panel-product-list"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="/js/catalog.js?v=20260821-catalog-1"></script>
    <script src="/js/panel.js?v=20260821-catalog-1"></script>
</body>

</html>
